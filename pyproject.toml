[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-analytics-pipeline"
version = "0.1.0"
description = "Synthetic retail analytics pipeline portfolio project"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pandas>=2.2.3,<4",
    "openpyxl>=3.1.5,<4",
    "SQLAlchemy>=2.0.36,<2.1",
    "pyodbc>=5.2,<6",
    "python-dotenv>=1.0.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
